    function applyFilters() {
        let filtered = currentCategory === 'all' ? [...products] : products.filter(p => p.category === currentCategory);
        if (wholesalePriceEnabled) {
            filtered = filtered.filter(p => p.wholesale === true);
            filtered = filtered.map(p => { let newP = {...p, price: Math.round(p.price * 0.85)}; return newP; });
        } else {
            let min = +document.getElementById('minPrice')?.value||0, max = +document.getElementById('maxPrice')?.value||500000;
            filtered = filtered.filter(p => p.price >= min && p.price <= max);
            if (document.getElementById('inStockOnly')?.checked) filtered = filtered.filter(p => p.inStock);
            if (document.getElementById('installmentGoods')?.checked) filtered = filtered.filter(p => p.installment);
            let disc = []; if(document.getElementById('disc5')?.checked) disc.push(5); if(document.getElementById('disc10')?.checked) disc.push(10); if(document.getElementById('disc20')?.checked) disc.push(20);
            if(disc.length) filtered = filtered.filter(p => disc.includes(p.discount));
            let brands = Array.from(document.querySelectorAll('#brandList input:checked')).map(cb => cb.value);
            if(brands.length) filtered = filtered.filter(p => brands.includes(p.brand));
            if(currentCategory !== 'all' && filterData[currentCategory]) {
                for(let [key, values] of Object.entries(filterData[currentCategory])) {
                    if(key !== 'brands') {
                        let checked = Array.from(document.querySelectorAll(`#filter_${key} input:checked`)).map(cb => cb.value);
                        if(checked.length) {
                            filtered = filtered.filter(p => checked.includes(p.specs[getSpecKey(key)]));
                        }
                    }
                }
            }
            let searchTerm = document.getElementById('globalSearchInput')?.value.toLowerCase();
            if(searchTerm) filtered = filtered.filter(p => p.name.toLowerCase().includes(searchTerm) || p.brand.toLowerCase().includes(searchTerm));
        }
        filteredProducts = filtered;
        updateProductsGrid();
    }
    
    function updateProductsGrid() { 
        let html=''; 
        filteredProducts.forEach(p=>{ 
            let finalPrice = p.price;
            let oldPriceHtml = p.discount > 0 ? `<span class="old-price">${p.originalPrice.toLocaleString()} ₽</span>` : '';
            let voteStatus = userVotes[p.id];
            html+=`<div class="product-card"><img src="${p.image}" class="product-image" onclick="openProductModal(${p.id})"><div class="product-info" onclick="openProductModal(${p.id})"><div class="product-name">${p.name}</div><div class="product-price">${finalPrice.toLocaleString()} ₽ ${oldPriceHtml}</div><div>⭐ ${p.rating}</div><div class="rating-buttons"><button class="rating-btn ${voteStatus === 'up' ? 'voted' : ''}" onclick="event.stopPropagation(); voteProduct(${p.id}, 'up')">👍 ${p.votes.up}</button><button class="rating-btn ${voteStatus === 'down' ? 'voted' : ''}" onclick="event.stopPropagation(); voteProduct(${p.id}, 'down')">👎 ${p.votes.down}</button></div></div><div class="product-actions"><button class="add-to-cart" onclick="addToCart(${p.id}); event.stopPropagation()">🛒 В корзину</button><button class="add-to-favorite" onclick="toggleFavorite(${p.id}); event.stopPropagation()">${currentFavorites.includes(p.id) ? '★' : '☆'}</button></div></div>`; 
        }); 
        document.getElementById('productsGrid').innerHTML = html || '<div style="text-align:center;padding:40px">Товары не найдены</div>'; 
        document.getElementById('productsCount').innerText = filteredProducts.length; 
    }
    function sortProducts(type) { if(type === 'priceAsc') filteredProducts.sort((a,b)=>a.price-b.price); else if(type === 'priceDesc') filteredProducts.sort((a,b)=>b.price-a.price); else if(type === 'ratingDesc') filteredProducts.sort((a,b)=>b.rating-a.rating); updateProductsGrid(); }
    function filterByCategory(cat) { currentCategory = cat; renderFilters(); applyFilters(); document.querySelectorAll('.category-btn').forEach(btn=>btn.classList.remove('active')); if(event?.target && event.target.classList) event.target.classList.add('active'); }
    function toggleCompare(id,checked) { if(checked){ if(compareList.length>=3){ alert('Максимум 3'); if(event?.target) event.target.checked=false; return; } compareList.push(id); } else compareList=compareList.filter(i=>i!==id); let bar=document.getElementById('compareBar'); if(compareList.length){ let html=''; compareList.forEach(i=>{ let p=products.find(x=>x.id===i); html+=`<div class="compare-item"><img src="${p.image}" width="30"><span>${p.name}</span><span onclick="toggleCompare(${i},false)" style="cursor:pointer">✕</span></div>`; }); document.getElementById('compareProducts').innerHTML=html; bar.style.display='flex'; } else bar.style.display='none'; }
    function compareProducts() { if(compareList.length<2){ alert('Выберите 2+ товара'); return; } let win=window.open('','Сравнение','width=1100,height=650'); let html=`<html><head><title>Сравнение</title><style>th,td{border:1px solid #ccc;padding:12px}th{background:#0f172a;color:white}</style></head><body><h2>Сравнение</h2><table><th>Параметр</th>${compareList.map(id=>`<th>${products.find(p=>p.id===id).name}</th>`).join('')}</table>`; let allSpecs=new Set(); compareList.forEach(id=>{ let p=products.find(p=>p.id===id); Object.keys(p.specs).forEach(k=>allSpecs.add(k)); }); allSpecs.forEach(spec=>{ html+=`<tr><th>${spec}</th>${compareList.map(id=>`<td>${products.find(p=>p.id===id).specs[spec]||'-'}</td>`).join('')}<tr>`; }); html+=`<tr><th>Цена</th>${compareList.map(id=>`<td>${products.find(p=>p.id===id).price.toLocaleString()} ₽</td>`).join('')}</tr>`; html+=`<tr><button onclick="window.close()">Закрыть</button></body></html>`; win.document.write(html); }
    function openProductModal(id) { 
        let p=products.find(x=>x.id===id); 
        let specsHtml='<table class="specs-table">'; for(let [k,v] of Object.entries(p.specs)) specsHtml+=`<tr><td style="padding:12px;background:#f1f5f9;width:180px">${k}</td><td style="padding:12px">${v}</td></tr>`; specsHtml+='</table>';
        let oldPriceHtml = p.discount > 0 ? `<span class="old-price" style="font-size:18px;">${p.originalPrice.toLocaleString()} ₽</span>` : '';

        similar.forEach(s=>{ let priceCompare = s.price < p.price ? '🔻 Дешевле' : (s.price > p.price ? '🔺 Дороже' : '💰 Одинаково'); simHtml+=`<div class="similar-item" onclick="openProductModal(${s.id})"><img src="${s.image}" width="100%" style="height:100px;object-fit:contain;margin-bottom:8px;"><div style="font-weight:700">${s.name}</div><div class="product-price" style="font-size:16px">${s.price.toLocaleString()} ₽</div><div style="font-size:11px;color:#3b82f6">${priceCompare}</div></div>`; });

    function renderCategories() { let catsList = [{id:'all',name:'Все товары'},{id:'notebooks',name:'💻 Ноутбуки'},{id:'smartphones',name:'📱 Смартфоны'},{id:'tvs',name:'📺 Телевизоры'},{id:'computers',name:'🖥️ Компьютеры'},{id:'monitors',name:'🖥️ Мониторы'},{id:'projectors',name:'📽️ Проекторы'}]; document.getElementById('categoriesContainer').innerHTML = catsList.map(c=>`<button class="category-btn ${c.id===currentCategory?'active':''}" onclick="filterByCategory('${c.id}')">${c.name}</button>`).join(''); }

"submitOrder()">✅ Подтвердить заказ</button>`; document.getElementById('checkoutBody').innerHTML = html; document.querySelector('input[name="paymentMethod"][value="card"]').checked = true; document.querySelector('input[name="paymentTiming"][value="now"]').checked = true; updatePaymentMethod('card'); updatePaymentTiming('now'); }

    function submitOrder() { let total=currentCart.reduce((s,i)=>s+i.price*i.quantity,0); let m=document.querySelector('input[name="paymentMethod"]:checked')?.value; let t=document.querySelector('input[name="paymentTiming"]:checked')?.value; let sid=parseInt(document.getElementById('pickupStore')?.value); let s=storesList.find(s=>s.id===sid); if(!s){ alert('Выберите магазин'); return; } if(m==='card'&&t==='now') if(!validateCard()) return; if(m==='cash'&&t==='now'){ alert('Наличными можно оплатить только при получении'); return; } let orders=getOrders(); let nid=orders.length>0?Math.max(...orders.map(o=>o.id))+1:1; orders.push({ id:nid, userId:currentUser.id, items:[...currentCart], total, status:'Новый', paymentMethod:m, paymentTiming:t, store:s.name, storeAddress:s.address, date:new Date().toLocaleString() }); saveOrders(orders); addNotification(currentUser.id, `Ваш заказ №${nid} оформлен. Статус: Новый. Самовывоз: ${s.name}`); alert(`Заказ №${nid} оформлен!\nСамовывоз: ${s.name}\n${s.address}`); currentCart=[]; saveUserData(); closeCheckoutModal(); updateCounters(); updateProductsGrid(); renderCartModal(); }

    // ======================= ФУНКЦИИ ДЛЯ БЭКАПА ДАННЫХ =======================
    function exportAllData() {
        const allData = {
            products: products,
            users: getUsers(),
            orders: getOrders(),
            complaints: complaints,
            userNotifications: userNotifications,
            version: "1.0",
            exportDate: new Date().toISOString()
        };
        
        const dataStr = JSON.stringify(allData, null, 2);
        const blob = new Blob([dataStr], {type: "application/json"});
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `shop_backup_${new Date().toISOString().slice(0,19).replace(/:/g, '-')}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showNotification("✅ Данные успешно экспортированы!");
    }
    
    function importAllData(file) {
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const importedData = JSON.parse(e.target.result);
                
                // Восстанавливаем товары
                if (importedData.products && Array.isArray(importedData.products)) {
                    products = importedData.products;
                    saveProductsToStorage();
                }
                
                // Восстанавливаем пользователей
                if (importedData.users && Array.isArray(importedData.users)) {
                    saveUsers(importedData.users);
                }
                
                // Восстанавливаем заказы
                if (importedData.orders && Array.isArray(importedData.orders)) {
                    saveOrders(importedData.orders);
                }
                
                // Восстанавливаем жалобы
                if (importedData.complaints && Array.isArray(importedData.complaints)) {
                    complaints = importedData.complaints;
                    saveComplaints();
                }
                
                // Восстанавливаем уведомления
                if (importedData.userNotifications) {
                    userNotifications = importedData.userNotifications;
                    localStorage.setItem('userNotifications', JSON.stringify(userNotifications));
                }
                
                showNotification("✅ Данные успешно импортированы! Обновите страницу.");
                setTimeout(() => location.reload(), 1500);
            } catch(err) {
                alert("Ошибка при импорте: неверный формат файла");
                console.error(err);
            }
        };
        reader.readAsText(file);
    }
    
    function triggerImport() {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = '.json';
        input.onchange = (e) => {
            if (e.target.files && e.target.files[0]) {
                importAllData(e.target.files[0]);
            }
        };
        input.click();
    }

        let imageSrc = product ? product.image : '';
        let isEdit = !!product;
        let currentSpecs = product ? product.specs : {};
        let specsHtml = getSpecsFormHTML(categoryVal, currentSpecs);
        return `<div>
            <div class="form-field"><label>Название товара</label><input type="text" id="modalProductName" value="${nameVal.replace(/"/g, '&quot;')}"></div>
            <div class="form-field"><label>Исходная цена (₽)</label><input type="number" id="modalOriginalPrice" value="${origPriceVal}"></div>
            <div class="form-field"><label>Скидка</label><div class="discount-buttons" id="discountButtonsContainer"><button type="button" class="discount-btn" data-discount="5">5%</button><button type="button" class="discount-btn" data-discount="15">15%</button><button type="button" class="discount-btn" data-discount="20">20%</button></div><input type="hidden" id="modalDiscount" value="${discountVal}"></div>
            <div class="price-preview" id="pricePreview">Итоговая цена: ${product ? product.price : 0} ₽</div>
            <div class="form-field"><label>Категория</label><select id="modalProductCategory" onchange="updateSpecsForm()"><option ${categoryVal==='notebooks'?'selected':''}>notebooks</option><option ${categoryVal==='smartphones'?'selected':''}>smartphones</option><option ${categoryVal==='tvs'?'selected':''}>tvs</option><option ${categoryVal==='computers'?'selected':''}>computers</option><option ${categoryVal==='monitors'?'selected':''}>monitors</option><option ${categoryVal==='projectors'?'selected':''}>projectors</option></select></div>
            <div class="form-field"><label>Бренд</label><input type="text" id="modalProductBrand" value="${brandVal.replace(/"/g, '&quot;')}"></div>
            <div class="form-field"><label>Изображение</label><input type="file" id="modalProductImage" accept="image/*"><div id="imagePreview" class="image-preview">${imageSrc ? `<img src="${imageSrc}" style="max-width:100px; border-radius:12px;">` : ''}</div></div>
            <div class="form-field"><label>Описание</label><textarea id="modalProductDesc" rows="3">${descVal.replace(/"/g, '&quot;')}</textarea></div>
            <div id="specsContainer">${specsHtml}</div>
            <div style="display:flex; gap:16px; margin-top:20px;"><button class="apply-filter-btn" onclick="confirmProductSave(${isEdit ? product.id : 'null'})">✅ ${isEdit ? 'Сохранить изменения' : 'Добавить товар'}</button><button class="action-btn" onclick="closeFormModal()">❌ Отмена</button></div>
        </div>`;
    }
    
    function updateSpecsForm() {
        let category = document.getElementById('modalProductCategory').value;
        let currentSpecs = {};
        if(filterData[category]) {
            for(let key of Object.keys(filterData[category])) {
                if(key !== 'brands') {
                    let el = document.getElementById(`spec_${key}`);
                    if(el) currentSpecs[getSpecKey(key)] = el.value;
                }
            }
        }
        let specsHtml = getSpecsFormHTML(category, currentSpecs);
        document.getElementById('specsContainer').innerHTML = specsHtml;
        attachDiscountButtonsLogic();
    }
    
    function showAddProductModal() { 
        let html = getProductFormHTML(null);
        openFormModal('➕ Добавление товара', html); 
        setTimeout(() => {
            attachDiscountButtonsLogic();
            window.updateSpecsForm = updateSpecsForm;
        }, 50);
    }
    function editProduct(product) { 
        let html = getProductFormHTML(product);
        openFormModal('✏️ Редактирование товара', html); 
        setTimeout(() => {
            attachDiscountButtonsLogic();
            window.updateSpecsForm = updateSpecsForm;
        }, 50);
    }
    
    function attachDiscountButtonsLogic() {
        let btns = document.querySelectorAll('.discount-btn');
        let discInput = document.getElementById('modalDiscount');
        let origInput = document.getElementById('modalOriginalPrice');
        let previewDiv = document.getElementById('pricePreview');
        if(!btns.length || !discInput || !origInput) return;
        let updatePrice = () => {
            let orig = parseInt(origInput.value) || 0;
            let disc = parseInt(discInput.value) || 0;
            let final = disc > 0 ? Math.round(orig * (100 - disc) / 100) : orig;
            previewDiv.innerHTML = `Итоговая цена: ${final.toLocaleString()} ₽` + (disc > 0 && orig > 0 ? ` <span style="font-size:12px;">(было ${orig.toLocaleString()} ₽)</span>` : '');
        };
        btns.forEach(btn => {
            btn.addEventListener('click', function() {
                let d = parseInt(this.dataset.discount);
                discInput.value = d;
                btns.forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                updatePrice();
            });
        });
        origInput.addEventListener('input', updatePrice);
        let currentDisc = parseInt(discInput.value);
        if(currentDisc > 0) {
            let activeBtn = Array.from(btns).find(b => parseInt(b.dataset.discount) === currentDisc);
            if(activeBtn) activeBtn.classList.add('active');
        }
        updatePrice();
        let fileInput = document.getElementById('modalProductImage');
        if(fileInput) {
            fileInput.addEventListener('change', function(e) {
                let file = e.target.files[0];
                if(file) {
                    let reader = new FileReader();
                    reader.onload = function(ev) {
                        let preview = document.getElementById('imagePreview');
                        if(preview) preview.innerHTML = `<img src="${ev.target.result}" style="max-width:100px; border-radius:12px;">`;
                    };
                    reader.readAsDataURL(file);
                }
            });
        }
    }
    
    function confirmProductSave(productId) {
        let name = document.getElementById('modalProductName').value;
        let origPrice = parseInt(document.getElementById('modalOriginalPrice').value);
        let discount = parseInt(document.getElementById('modalDiscount').value) || 0;
        if(discount < 0) discount = 0; if(discount > 20) discount = 20;
        let finalPrice = discount > 0 ? Math.round(origPrice * (100 - discount) / 100) : origPrice;
        let category = document.getElementById('modalProductCategory').value;
        let brand = document.getElementById('modalProductBrand').value;
        let description = document.getElementById('modalProductDesc').value;
        let file = document.getElementById('modalProductImage').files[0];
        
        let specs = {};
        if(filterData[category]) {
            for(let key of Object.keys(filterData[category])) {
                if(key !== 'brands') {
                    let el = document.getElementById(`spec_${key}`);
                    if(el) specs[getSpecKey(key)] = el.value;
                }
            }
        }
        specs['Бренд'] = brand;
        
        let finishSave = (imgUrl) => {
            if(productId === null) {
                let newId = products.length + 1;
                products.push({ 
                    id:newId, name:name, originalPrice:origPrice, price:finalPrice, category:category, brand:brand, 
                    rating:4.5, inStock:true, discount:discount, installment:true, isNew:false, image:imgUrl, 
                    description:description || 'Новый товар', specs:specs, votes:{ up:0, down:0 }, wholesale:false 
                });
                saveProductsToStorage();
                closeFormModal(); loadAdminSection('products'); applyFilters(); alert('Товар добавлен');
            } else {
                let p = products.find(p => p.id === productId);
                if(p) {
                    p.name = name; p.originalPrice = origPrice; p.discount = discount; p.price = finalPrice; 
                    p.category = category; p.brand = brand; p.description = description; p.image = imgUrl; p.specs = specs;
                    saveProductsToStorage();
                    closeFormModal(); loadAdminSection('products'); applyFilters(); alert('Товар обновлён');
                }
            }
        };
        if(file) {
            let reader = new FileReader();
            reader.onload = e => finishSave(e.target.result);
            reader.readAsDataURL(file);
        } else {
            let existingImg = document.querySelector('#imagePreview img')?.src;
            finishSave(existingImg || 'https://avatars.mds.yandex.net/get-mpic/5238882/img_id7129462892158577910.jpeg/orig');
        }
    }
    
    function openFormModal(title, html) { document.getElementById('formModalTitle').innerText=title; document.getElementById('formModalBody').innerHTML=html; document.getElementById('formModal').style.display='block'; }
    function closeFormModal() { document.getElementById('formModal').style.display='none'; }
    function setupGlobalSearch() { let inp=document.getElementById('globalSearchInput'); let res=document.getElementById('globalSearchResults'); inp?.addEventListener('input',()=>{ let q=inp.value.toLowerCase(); if(q.length<2){ res.style.display='none'; applyFilters(); return; } let f=products.filter(p=>p.name.toLowerCase().includes(q)||p.brand.toLowerCase().includes(q)).slice(0,10); if(f.length){ let html=''; f.forEach(p=>{ html+=`<div style="padding:12px 16px; border-bottom:1px solid #eee; cursor:pointer; display:flex; gap:10px;" onclick="openProductModal(${p.id})"><img src="${p.image}" width="40"><div><b>${p.name}</b><br>${p.price.toLocaleString()} ₽</div></div>`; }); res.innerHTML=html; res.style.display='block'; } else res.style.display='none'; applyFilters(); }); document.addEventListener('click',(e)=>{ if(!inp?.contains(e.target)) res.style.display='none'; }); }
    
    function updateUI() { 
        let btn=document.getElementById('authBtn'); 
        let ua=document.getElementById('userActions'); 
        let old=document.querySelector('.logout-btn'); 
        let supportBtn=document.getElementById('supportBtn');
        let cartBtn = document.getElementById('cartBtn');
        let favBtn = document.getElementById('favBtn');
        if(supportBtn) supportBtn.remove(); if(old) old.remove();
        
        if(currentUser){ 
            btn.innerHTML=`👤 ${currentUser.name}`; btn.onclick=openProfileModal; 
            let lb=document.createElement('button'); lb.className='action-btn logout-btn'; lb.innerHTML='🚪 Выйти'; lb.onclick=logout; ua.appendChild(lb);
            
            if(currentUser.role === 'admin' || currentUser.role === 'manager') {
                if(cartBtn) cartBtn.style.display = 'none';
                if(favBtn) favBtn.style.display = 'none';
            } else {
                if(cartBtn) cartBtn.style.display = 'flex';
                if(favBtn) favBtn.style.display = 'flex';
            }

            if(currentUser.role === 'user') {
                let supBtn=document.createElement('button'); supBtn.id='supportBtn'; supBtn.className='action-btn'; supBtn.innerHTML='📞 Поддержка'; supBtn.onclick=openSupportModal; ua.insertBefore(supBtn, lb);
            }
            if(currentUser.role==='admin'||currentUser.role==='manager'){ showAdminPanel(); document.getElementById('catalogSearchBox').classList.add('search-hidden'); } 
            else { document.getElementById('adminPanelContainer').style.display='none'; document.getElementById('catalogUserView').style.display='block'; document.getElementById('catalogSearchBox').classList.remove('search-hidden'); } 
        } else { 
            btn.innerHTML='👤 Войти'; btn.onclick=openAuthModal; 
            document.getElementById('adminPanelContainer').style.display='none'; document.getElementById('catalogUserView').style.display='block'; document.getElementById('catalogSearchBox').classList.remove('search-hidden');
            if(cartBtn) cartBtn.style.display = 'flex';
            if(favBtn) favBtn.style.display = 'flex';
        } 
    }
    function openAuthModal(){ document.getElementById('authModal').style.display='block'; } function closeAuthModal(){ document.getElementById('authModal').style.display='none'; }
    function showRegister(){ document.getElementById('loginForm').style.display='none'; document.getElementById('registerForm').style.display='block'; }
    function showLogin(){ document.getElementById('loginForm').style.display='block'; document.getElementById('registerForm').style.display='none'; }
    
    initDB(); currentUser=null; loadUserData(); updateUI(); renderCategories(); renderFilters(); applyFilters(); initMap(); setupGlobalSearch();
    window.filterByCategory=filterByCategory; window.sortProducts=sortProducts; window.applyFilters=applyFilters; window.resetFilters=resetFilters; window.toggleWholesaleFilter=toggleWholesaleFilter;
    window.addToCart=addToCart; window.toggleFavorite=toggleFavorite; window.openCart=openCart; window.closeCart=closeCart; window.openFavorites=openFavorites; window.closeFavorites=closeFavorites;
    window.changeQuantity=changeQuantity; window.removeFromCart=removeFromCart; window.toggleCompare=toggleCompare; window.compareProducts=compareProducts; window.openProductModal=openProductModal; window.closeModal=closeModal;
    window.openStores=openStores; window.closeStores=closeStores; window.openAuthModal=openAuthModal; window.closeAuthModal=closeAuthModal; window.showRegister=showRegister; window.showLogin=showLogin;
    window.register=register; window.login=login; window.logout=logout; window.openCheckoutModal=openCheckoutModal; window.closeCheckoutModal=closeCheckoutModal; window.submitOrder=submitOrder;
    window.loadAdminSection=loadAdminSection; window.deleteUser=deleteUser; window.saveOrder=saveOrder; window.deleteOrder=deleteOrder; window.deleteProduct=deleteProduct;
    window.showAddUserModal=showAddUserModal; window.confirmAddUser=confirmAddUser; window.editUser=editUser; window.confirmEditUser=confirmEditUser;
    window.showAddProductModal=showAddProductModal; window.editProduct=editProduct; window.confirmProductSave=confirmProductSave; window.closeFormModal=closeFormModal;
    window.updatePaymentMethod=updatePaymentMethod; window.updatePaymentTiming=updatePaymentTiming; window.voteProduct=voteProduct; window.toggleWholesaleProduct=toggleWholesaleProduct;
    window.openSupportModal=openSupportModal; window.closeSupportModal=closeSupportModal; window.openProfileModal=openProfileModal; window.closeProfileModal=closeProfileModal;
    window.answerComplaint=answerComplaint; window.deleteComplaint=deleteComplaint; window.toggleFilterGroup=toggleFilterGroup; window.updateSpecsForm=updateSpecsForm;
    window.viewOrderItems = viewOrderItems;
    window.closeOrderItemsModal = closeOrderItemsModal;
    window.exportAllData = exportAllData;
    window.triggerImport = triggerImport;
</script>
